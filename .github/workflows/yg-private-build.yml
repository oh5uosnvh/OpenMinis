name: YG Private Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag on the private repo'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private YG source
        uses: actions/checkout@v4
        with:
          repository: oh5uosnvh/Minis-qiyiguo
          ref: yg-main
          token: ${{ secrets.YG_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install NDK r28 and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          ok=0
          for i in 1 2 3 4; do
            if "$SDKM" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"; then ok=1; break; fi
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp" || true
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "NDK install failed"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init || true

      - name: Build native dependencies
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v4-yg-private

      - name: Build release APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload artifact (public run page, private repo release below)
        uses: actions/upload-artifact@v4
        with:
          name: MinisApp-qiyiguo-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload to private repo release
        run: |
          TAG="${{ inputs.release_tag }}"
          APK=$(ls src/android/app/build/outputs/apk/release/*.apk | head -1)
          # get release id (create if missing)
          REL_ID=$(curl -s -H "Authorization: token ${{ secrets.YG_PAT }}" \
            "https://api.github.com/repos/oh5uosnvh/Minis-qiyiguo/releases/tags/$TAG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s -X POST -H "Authorization: token ${{ secrets.YG_PAT }}" \
              https://api.github.com/repos/oh5uosnvh/Minis-qiyiguo/releases \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Built from private source via public runner\",\"draft\":false,\"prerelease\":false}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          fi
          echo "release id: $REL_ID"
          curl -s -X POST -H "Authorization: token ${{ secrets.YG_PAT }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/oh5uosnvh/Minis-qiyiguo/releases/$REL_ID/assets?name=$(basename $APK)"
